# ============================================================
#  docker-compose.yml - Levanta TODO el sistema en local.
# ------------------------------------------------------------
#  Dos contenedores desde la MISMA imagen:
#    - servidor : omniNames + servidor CORBA
#    - web      : Flask (web + cliente CORBA)
#
#  Se comunican por la red interna de Docker usando el nombre
#  'servidor' como host (Docker lo resuelve por DNS interno).
#  El arranque de cada rol vive en docker/entrypoint-*.sh para
#  evitar comandos multilinea fragiles en este YAML.
#
#  Uso:
#    docker compose up --build
#    # luego abre  http://localhost:8080
# ============================================================
services:

  servidor:
    build: .
    image: semaforos-corba:latest
    container_name: semaforos-servidor
    command: ["sh", "/app/docker/entrypoint-server.sh"]
    environment:
      - PUBLISH_HOST=servidor
      - IIOP_PORT=5000
      - NS_PORT=2809
    ports:
      - "5000:5000"
      - "2809:2809"
    networks:
      - corba-net

  web:
    build: .
    image: semaforos-corba:latest
    container_name: semaforos-web
    depends_on:
      - servidor
    command: ["sh", "/app/docker/entrypoint-web.sh"]
    environment:
      - SERVER_HOST=servidor
      - NS_PORT=2809
      - WEB_PORT=8080
    ports:
      - "8080:8080"
    # Red de seguridad: si la web aun asi fallara al arrancar, que reintente.
    restart: on-failure
    networks:
      - corba-net

networks:
  corba-net:
    driver: bridge
